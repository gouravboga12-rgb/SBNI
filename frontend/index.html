<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just Paisa App - India's Premier B2B Business Directory & Commercial Networking</title>
    <meta name="description" content="Connect directly with verified Commercial Vendors, Suppliers, and Business Partners across India. Direct B2B business discovery, location-based search, verified credentials, and instant commercial networking." />
    <meta name="keywords" content="Just Paisa, B2B business directory, MSME directory India, commercial vendors, suppliers, enterprise networking, small shop business discovery, wholesale partners India" />
    <meta name="author" content="Just Paisa" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://justpaisa.in/" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="google-site-verification-placeholder" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Just Paisa" />
    <meta property="og:url" content="https://justpaisa.in/" />
    <meta property="og:title" content="Just Paisa App - India's Premier B2B Business Directory & Commercial Networking" />
    <meta property="og:description" content="Connect directly with verified Commercial Vendors, Suppliers, and Business Partners across India. Direct B2B business discovery and networking." />
    <meta property="og:image" content="https://justpaisa.in/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://justpaisa.in/" />
    <meta name="twitter:title" content="Just Paisa App - India's Premier B2B Business Directory" />
    <meta name="twitter:description" content="Connect directly with verified Commercial Vendors, Suppliers, and Business Partners across India." />
    <meta name="twitter:image" content="https://justpaisa.in/logo.png" />

    <!-- Structured Data: Organization & WebSite (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://justpaisa.in/#organization",
          "name": "Just Paisa",
          "url": "https://justpaisa.in/",
          "logo": "https://justpaisa.in/logo.png",
          "description": "India's premier B2B Business Directory and Commercial Networking platform.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "Customer Support",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi"]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://justpaisa.in/#website",
          "url": "https://justpaisa.in/",
          "name": "Just Paisa App",
          "publisher": {
            "@id": "https://justpaisa.in/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://justpaisa.in/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
            },
            colors: {
              slate: {
                950: '#030712',
                900: '#0f172a',
                800: '#1e293b',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <!-- Razorpay Standard Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
